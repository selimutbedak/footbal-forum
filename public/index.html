<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Football Forum</title>
<style>
:root {
  --bg:#101114; --panel:#191b20; --panel2:#20232a;
  --line:#2c3039; --text:#f4f5f7; --muted:#9299a6;
  --red:#e63946; --green:#27c47d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-size:14px}
button,input,select{font:inherit}
header{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#101114f2;backdrop-filter:blur(12px);z-index:10}
.brand{font-size:19px;font-weight:850;letter-spacing:-.7px}
.brand span{color:var(--red)}
nav{display:flex;gap:7px}
nav button{background:transparent;color:var(--muted);border:0;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px}
nav button.active,nav button:hover{background:var(--panel2);color:white}
main{max-width:1180px;margin:24px auto;padding:0 18px 60px}
h1{font-size:23px;letter-spacing:-.7px;margin:0 0 5px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:0}
.sub{color:var(--muted);font-size:12px}
.section{margin-top:25px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.match-list{display:grid;gap:9px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;transition:.15s}
.match:hover{border-color:#555d6b;transform:translateY(-1px)}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:11px}
.league-label{display:flex;align-items:center;gap:7px;min-width:0}
.league-label img{width:17px;height:17px;object-fit:contain}
.status{font-size:10px;padding:4px 7px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.status.live{background:#542027;color:#ff7580}
.teams{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:8px}
.team{display:flex;align-items:center;gap:9px;min-width:0}
.team.away{justify-content:flex-end;text-align:right}
.team img{width:29px;height:29px;object-fit:contain;flex-shrink:0}
.team-name{font-size:13px;font-weight:650;overflow-wrap:anywhere}
.score{text-align:center;font-weight:800;font-size:18px;white-space:nowrap}
.score small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.league-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer}
.league-card:hover{border-color:#596171}
.league-card img{width:38px;height:38px;object-fit:contain}
.league-card strong{font-size:13px;display:block}
.league-card small{color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:white;padding:10px 12px;min-height:39px}
button.primary{background:var(--red);color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}
.empty,.loading,.error{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.error{color:#ff858c}
.back{background:transparent;color:#cbd0d9;border:1px solid var(--line);border-radius:7px;padding:8px 11px;margin-bottom:17px;cursor:pointer}
.detail-score{padding:25px 16px;text-align:center}
.detail-score .teams{max-width:600px;margin:20px auto}
.detail-score .team{flex-direction:column;text-align:center;justify-content:center}
.detail-score .team img{width:58px;height:58px}
.detail-score .team-name{font-size:15px}
.detail-score .score{font-size:28px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:7px;cursor:pointer}
.tabs button.active{background:var(--red);color:white;border-color:var(--red)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line);font-size:12px}
.stat-row span:nth-child(2){text-align:center;color:var(--muted)}
.stat-row span:last-child{text-align:right}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:13px}
.lineup h3{margin-bottom:10px}
.player{display:flex;justify-content:space-between;gap:7px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--muted);font-weight:600}
.club-cell{display:flex;align-items:center;gap:8px;font-weight:650}
.club-cell img{width:21px;height:21px;object-fit:contain}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(max-width:600px){
 header{padding:0 13px;height:57px}.brand{font-size:17px}nav{gap:0}nav button{padding:8px 9px;font-size:12px}
 main{padding:0 12px 40px;margin-top:19px}h1{font-size:20px}
 .match{padding:11px}.team{gap:6px}.team img{width:25px;height:25px}.team-name{font-size:12px}
 .teams{grid-template-columns:1fr 45px 1fr;gap:5px}.score{font-size:16px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.league-card{padding:10px;gap:8px}.league-card img{width:29px;height:29px}.league-card strong{font-size:11px}
 .lineup{grid-template-columns:1fr}.detail-score{padding:18px 9px}
}
</style>
</head>
<body>
<header>
  <div class="brand">FOOTBALL<span>FORUM</span></div>
  <nav>
    <button class="active" data-page="home">Beranda</button>
    <button data-page="matches">Pertandingan</button>
    <button data-page="leagues">Liga</button>
  </nav>
</header>

<main id="app"><div class="loading">Memuat data sepak bola...</div></main>
<footer>Football Forum · Data pertandingan dari API-Football</footer>

<script>
const app=document.getElementById("app");
let page="home", currentLeague=null, currentFixture=null, detailTab="overview";
let leagueCache=[];

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(params)=>{
  const url="/api/football?"+new URLSearchParams(params);
  const r=await fetch(url);
  const j=await r.json();
  if(!r.ok||!j.ok)throw new Error(j.error||"Gagal mengambil data.");
  return j.data;
};
const img=(url,name="?",cls="")=>{
  const safe=esc(url||"");
  return `<img class="${cls}" src="${safe}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="logo-fallback" style="display:none;width:29px;height:29px;border-radius:50%;background:#303541;color:#fff;place-items:center;font-size:11px;font-weight:bold">${esc((name||"?").slice(0,2).toUpperCase())}</span>`;
};
const dateText=d=>d?new Date(d).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const statusText=f=>{
  const s=f.fixture?.status?.short||"";
  if(["1H","2H","HT","ET","P","BT","LIVE"].includes(s))return "LIVE";
  if(s==="FT"||s==="AET"||s==="PEN")return "Selesai";
  return f.fixture?.status?.long||"Terjadwal";
};
const isLive=f=>["1H","2H","HT","ET","P","BT","LIVE"].includes(f.fixture?.status?.short||"");
const scoreText=f=>{
  const h=f.goals?.home,a=f.goals?.away;
  return h===null||h===undefined?"-":`${h} - ${a??0}`;
};
function matchCard(f){
  const league=f.league||{};
  const home=f.teams?.home||{},away=f.teams?.away||{};
  const live=isLive(f);
  return `<article class="match" onclick="openMatch(${Number(f.fixture?.id)})">
    <div class="match-top">
      <div class="league-label">${img(league.logo,league.name,"") }<span>${esc(league.name||"Pertandingan")} · ${esc(league.country||"")}</span></div>
      <span class="status ${live?"live":""}">${live?`● ${esc(f.fixture?.status?.elapsed??"")}’`:esc(statusText(f))}</span>
    </div>
    <div class="teams">
      <div class="team">${img(home.logo,home.name)}<span class="team-name">${esc(home.name)}</span></div>
      <div class="score">${scoreText(f)}<small>${dateText(f.fixture?.date)}</small></div>
      <div class="team away"><span class="team-name">${esc(away.name)}</span>${img(away.logo,away.name)}</div>
    </div>
  </article>`;
}
function matchList(items){
  return items?.length?`<div class="match-list">${items.map(matchCard).join("")}</div>`:`<div class="panel empty">Belum ada pertandingan pada periode ini.</div>`;
}
async function homePage(){
  app.innerHTML=`<h1>Beranda</h1><div class="sub">Ikuti pertandingan dan kabar sepak bola</div>
  <section class="section"><div class="section-head"><h2>🔴 Sedang berlangsung</h2></div><div id="live" class="loading">Memuat skor live...</div></section>
  <section class="section"><div class="section-head"><h2>Pertandingan hari ini</h2></div><div id="today" class="loading">Memuat jadwal...</div></section>
  <section class="section"><div class="section-head"><h2>Jadwal berikutnya</h2></div><div id="next" class="loading">Memuat jadwal...</div></section>`;
  try{
    const d=await api({type:"home"});
    $("#live").innerHTML=matchList(d.live);
    $("#today").innerHTML=matchList(d.today);
    $("#next").innerHTML=matchList(d.upcoming);
  }catch(e){["live","today","next"].forEach(id=>$("#"+id).innerHTML=`<div class="error">${esc(e.message)}</div>`)}
}
async function matchesPage(){
  const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jakarta"});
  app.innerHTML=`<h1>Pertandingan</h1><div class="sub">Cari jadwal dan hasil pertandingan</div>
  <div class="toolbar"><input type="date" id="matchDate" value="${today}"><select id="leagueFilter"><option value="">Semua liga</option></select><button class="primary" onclick="loadMatches()">Cari</button></div>
  <div id="matchResults" class="loading">Memuat pertandingan...</div>`;
  try{
    if(!leagueCache.length)leagueCache=await api({type:"leagues"});
    $("#leagueFilter").innerHTML='<option value="">Semua liga</option>'+leagueCache.map(x=>`<option value="${x.league.id}">${esc(x.league.name)} · ${esc(x.country.name)}</option>`).join("");
    await loadMatches();
  }catch(e){$("#matchResults").innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function loadMatches(){
  const el=$("#matchResults");if(!el)return;
  el.innerHTML='<div class="loading">Memuat pertandingan...</div>';
  try{
    const d=await api({type:"matches",date:$("#matchDate").value,league:$("#leagueFilter").value});
    el.innerHTML=matchList(d);
  }catch(e){el.innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function leaguesPage(){
  app.innerHTML=`<h1>Kompetisi</h1><div class="sub">Pilih liga untuk melihat klasemen</div><div id="leagueGrid" class="grid section"><div class="loading">Memuat daftar liga...</div></div>`;
  try{
    leagueCache=await api({type:"leagues"});
    $("#leagueGrid").innerHTML=leagueCache.map(x=>`<article class="league-card" onclick="openLeague(${x.league.id},${x.seasons?.[0]?.year||new Date().getFullYear()},'${esc(x.league.name).replace(/'/g,"")}')">
      ${img(x.league.logo,x.league.name)}
      <div><strong>${esc(x.league.name)}</strong><small>${esc(x.country.name)} · ${esc(x.seasons?.[0]?.year||"")}</small></div>
    </article>`).join("")||'<div class="empty">Tidak ada liga tersedia.</div>';
  }catch(e){$("#leagueGrid").innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function openLeague(id,season,name){
  currentLeague={id,season,name};page="league-detail";renderNav();
  app.innerHTML=`<button class="back" onclick="go('leagues')">← Kembali ke liga</button><h1>${esc(name)}</h1><div class="sub">Klasemen musim ${season}</div><div id="table" class="panel section loading">Memuat klasemen...</div>`;
  try{
    const data=await api({type:"standings",league:id,season});
    const rows=data[0]?.league?.standings?.flat()||[];
    $("#table").innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>#</th><th>Klub</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.rank}</td><td><div class="club-cell">${img(t.team.logo,t.team.name)}${esc(t.team.name)}</div></td><td>${t.all.played}</td><td>${t.all.win}</td><td>${t.all.draw}</td><td>${t.all.lose}</td><td>${t.goalsDiff}</td><td><b>${t.points}</b></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Klasemen belum tersedia untuk liga ini.</div>';
  }catch(e){$("#table").innerHTML=`<div class="error">${esc(e.message)}</div>`}
}
async function openMatch(id){
  if(!id)return;
  currentFixture=id;page="detail";detailTab="overview";renderNav();
  app.innerHTML='<div class="loading">Memuat detail pertandingan...</div>';
  try{
    const f=await api({type:"detail",fixture:id});
    if(!f)throw new Error("Pertandingan tidak ditemukan.");
    const h=f.teams.home,a=f.teams.away;
    app.innerHTML=`<button class="back" onclick="go('matches')">← Kembali</button>
    <div class="panel detail-score">
      <div class="sub">${esc(f.league.name)} · ${esc(f.league.country)} · ${dateText(f.fixture.date)}</div>
      <div class="teams">
        <div class="team">${img(h.logo,h.name)}<span class="team-name">${esc(h.name)}</span></div>
        <div class="score">${scoreText(f)}<small>${esc(statusText(f))}</small></div>
        <div class="team">${img(a.logo,a.name)}<span class="team-name">${esc(a.name)}</span></div>
      </div>
      <div class="sub">${esc(f.fixture.venue?.name||"Venue belum tersedia")}</div>
    </div>
    <div class="tabs">
      <button class="active" data-tab="overview" onclick="showDetailTab('overview')">Ringkasan</button>
      <button data-tab="stats" onclick="showDetailTab('stats')">Statistik</button>
      <button data-tab="lineups" onclick="showDetailTab('lineups')">Lineup</button>
      <button data-tab="h2h" onclick="showDetailTab('h2h')">H2H</button>
    </div>
    <div id="detailContent" class="panel"></div>`;
    window.matchDetail=f;
    showDetailTab("overview");
  }catch(e){app.innerHTML=`<button class="back" onclick="go('matches')">← Kembali</button><div class="error">${esc(e.message)}</div>`}
}
async function showDetailTab(tab){
  detailTab=tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  const el=$("#detailContent");if(!el)return;
  const f=window.matchDetail;
  el.innerHTML='<div class="loading">Memuat informasi...</div>';
  if(tab==="overview"){
    const events=f.events||[];
    el.innerHTML=events.length?events.map(e=>`<div class="stat-row"><span>${esc(e.time?.elapsed??"")}’ · ${esc(e.team?.name||"")}</span><span>${esc(e.detail||e.type)}</span><span>${esc(e.player?.name||"")}</span></div>`).join(""):'<div class="empty">Event pertandingan belum tersedia.</div>';
  }
  if(tab==="stats"){
    const stats=f.statistics||[];
    if(!stats.length){el.innerHTML='<div class="empty">Statistik belum tersedia. Biasanya data muncul saat atau setelah pertandingan dan bergantung pada cakupan liga.</div>';return}
    const left=stats[0]?.statistics||[],right=stats[1]?.statistics||[];
    const keys=[...new Set([...left.map(x=>x.type),...right.map(x=>x.type)])];
    el.innerHTML=keys.map(k=>{
      const l=left.find(x=>x.type===k)?.value??"-",r=right.find(x=>x.type===k)?.value??"-";
      return `<div class="stat-row"><span>${esc(l)}</span><span>${esc(k)}</span><span>${esc(r)}</span></div>`;
    }).join("");
  }
  if(tab==="lineups"){
    const teams=f.lineups||[];
    if(!teams.length){el.innerHTML='<div class="empty">Lineup belum dirilis atau tidak tersedia untuk pertandingan ini.</div>';return}
    el.innerHTML=`<div class="lineup">${teams.map(t=>`<div><h3>${esc(t.team.name)} · ${esc(t.formation||"")}</h3>${(t.startXI||[]).map(p=>`<div class="player"><span>${esc(p.player.number??"")} · ${esc(p.player.name)}</span><span>${esc(p.player.pos||"")}</span></div>`).join("")}<h3 style="margin-top:15px">Cadangan</h3>${(t.substitutes||[]).map(p=>`<div class="player"><span>${esc(p.player.number??"")} · ${esc(p.player.name)}</span><span>${esc(p.player.pos||"")}</span></div>`).join("")}</div>`).join("")}</div>`;
  }
  if(tab==="h2h"){
    try{
      const h=f.teams.home.id,a=f.teams.away.id;
      const rows=await api({type:"h2h",home:h,away:a});
      el.innerHTML=rows.length?`<div class="match-list" style="padding:10px">${rows.map(matchCard).join("")}</div>`:'<div class="empty">Belum ada riwayat pertemuan yang tersedia.</div>';
    }catch(e){el.innerHTML=`<div class="error">${esc(e.message)}</div>`}
  }
}
function renderNav(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
function go(p){page=p;renderNav();if(p==="home")homePage();if(p==="matches")matchesPage();if(p==="leagues")leaguesPage()}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
homePage();
</script>
</body>
</html>
