
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTBALL FORUM</title>

<style>
:root {
  --bg: #090d14;
  --panel: #111824;
  --panel2: #172130;
  --border: #253244;
  --text: #edf2f7;
  --muted: #8290a3;
  --green: #29cf83;
  --red: #ff5c67;
  --blue: #5597ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  height: 62px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  background: #0c121c;
  z-index: 10;
}

.logo {
  font-weight: 800;
  letter-spacing: 1px;
  font-size: 17px;
}

.logo span {
  color: var(--green);
}

.header-status {
  color: var(--muted);
  font-size: 11px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 18px;
}

.top-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

h1 {
  font-size: 22px;
  margin: 0;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 6px;
}

.date {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.tab {
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--panel);
  padding: 10px 15px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 12px;
}

.tab.active {
  background: var(--green);
  color: #06150e;
  border-color: var(--green);
  font-weight: bold;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 18px 0 12px;
  font-size: 14px;
  font-weight: bold;
}

.count {
  color: var(--muted);
  font-size: 11px;
  font-weight: normal;
}

.match-list {
  display: grid;
  gap: 9px;
}

.match {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 13px;
}

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.league {
  color: var(--muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.status {
  font-size: 10px;
  font-weight: bold;
  white-space: nowrap;
}

.status.live {
  color: var(--red);
}

.status.finished {
  color: var(--muted);
}

.status.upcoming {
  color: var(--green);
}

.teams {
  display: grid;
  grid-template-columns: 1fr 65px 1fr;
  align-items: center;
  gap: 8px;
}

.team {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 13px;
  font-weight: 600;
}

.team.away {
  justify-content: flex-end;
  text-align: right;
}

.team img {
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.team-name {
  overflow: hidden;
  text-overflow: ellipsis;
}

.score {
  font-size: 18px;
  font-weight: 800;
  text-align: center;
}

.match-time {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  margin-top: 11px;
}

.empty, .loading, .error {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 25px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.error {
  color: var(--red);
}

.refresh {
  border: 1px solid var(--border);
  color: var(--text);
  background: var(--panel);
  border-radius: 7px;
  padding: 9px 12px;
  cursor: pointer;
  font-size: 11px;
}

footer {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  padding: 30px 10px;
}

@media (min-width: 700px) {
  .match-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FOOTBALL <span>FORUM</span></div>
  <div class="header-status">● DATA CENTER</div>
</header>

<main class="container">

  <div class="top-title">
    <div>
      <h1>Match Center</h1>
      <div class="subtitle">Jadwal dan hasil pertandingan sepak bola</div>
    </div>
    <div>
      <div class="date" id="today"></div>
      <button class="refresh" onclick="loadMatches()">↻ Refresh</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all">Semua</button>
    <button class="tab" data-tab="live">● Live</button>
    <button class="tab" data-tab="upcoming">Akan Datang</button>
    <button class="tab" data-tab="finished">Selesai</button>
  </div>

  <div class="section-title">
    <span id="sectionName">Semua Pertandingan</span>
    <span class="count" id="matchCount">0 pertandingan</span>
  </div>

  <div id="matches" class="match-list">
    <div class="loading">Memuat pertandingan...</div>
  </div>

  <footer>
    FOOTBALL FORUM · Data pertandingan dari Highlightly
  </footer>

</main>

<script>
const API = "/api/football";
const state = {
  matches: [],
  tab: "all"
};

const $ = id => document.getElementById(id);

function jakartaDate() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jakarta",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const obj = {};
  parts.forEach(p => obj[p.type] = p.value);

  return `${obj.year}-${obj.month}-${obj.day}`;
}

function showDate() {
  $("today").textContent = new Intl.DateTimeFormat("id-ID", {
    dateStyle: "full",
    timeZone: "Asia/Jakarta"
  }).format(new Date());
}

async function api(type, params = {}) {
  const query = new URLSearchParams({
    type,
    source: "highlightly",
    ...params
  });

  const response = await fetch(`${API}?${query}`);
  const result = await response.json();

  if (!response.ok) {
    throw new Error(result.message || result.error || "API error");
  }

  return result.data;
}

function getArray(result) {
  if (Array.isArray(result)) return result;
  if (Array.isArray(result?.data)) return result.data;
  if (Array.isArray(result?.matches)) return result.matches;
  if (Array.isArray(result?.response)) return result.response;
  return [];
}

function statusOf(match) {
  const state = match.state || {};
  const description = String(
    state.description || state.status || state.short || ""
  ).toLowerCase();

  const code = String(
    state.code || state.short || match.status || ""
  ).toUpperCase();

  if (
    ["not started", "scheduled", "upcoming", "fixture", "pending"].some(
      word => description.includes(word)
    ) ||
    ["NS", "TBD", "SCHEDULED"].includes(code)
  ) {
    return "upcoming";
  }

  if (
    ["finished", "full time", "ended", "complete", "after penalties",
     "after extra time"].some(word => description.includes(word)) ||
    ["FT", "AET", "PEN", "FINISHED"].includes(code)
  ) {
    return "finished";
  }

  if (
    ["live", "in progress", "first half", "1st half", "second half",
     "2nd half", "half time", "halftime", "extra time",
     "penalty shootout", "interrupted", "suspended"].some(
      word => description.includes(word)
    ) ||
    ["1H", "2H", "HT", "ET", "P", "BT", "INT", "LIVE"].includes(code)
  ) {
    return "live";
  }

  return "unknown";
}

function teamName(team) {
  return team?.name || team?.shortName || "Tim belum diketahui";
}

function teamLogo(team) {
  return team?.logo || team?.image || team?.crest || "";
}

function scoreValue(match, side) {
  const state = match.state || {};
  const score = state.score || {};

  const candidates = [
    side === "home" ? match.homeScore : match.awayScore,
    side === "home" ? score.home : score.away,
    side === "home" ? score.homeScore : score.awayScore,
    side === "home" ? score.homeTeam : score.awayTeam
  ];

  for (const value of candidates) {
    if (value !== null && value !== undefined && value !== "") {
      if (typeof value === "object") {
        if (value.current !== undefined) return value.current;
        if (value.goals !== undefined) return value.goals;
      } else {
        return value;
      }
    }
  }

  return null;
}

function matchTime(match) {
  if (!match.date) return "";

  const date = new Date(match.date);

  if (Number.isNaN(date.getTime())) return "";

  return new Intl.DateTimeFormat("id-ID", {
    dateStyle: "medium",
    timeStyle: "short",
    timeZone: "Asia/Jakarta"
  }).format(date) + " WIB";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function matchCard(match) {
  const status = statusOf(match);

  const home = match.homeTeam || {};
  const away = match.awayTeam || {};
  const homeScore = scoreValue(match, "home");
  const awayScore = scoreValue(match, "away");

  const leagueName =
    match.league?.name ||
    match.competition?.name ||
    "Pertandingan";

  const labels = {
    live: "● LIVE",
    upcoming: "AKAN DATANG",
    finished: "SELESAI",
    unknown: "STATUS BELUM DIKETAHUI"
  };

  const score = homeScore !== null && awayScore !== null
    ? `${escapeHTML(homeScore)} - ${escapeHTML(awayScore)}`
    : "VS";

  const homeLogo = teamLogo(home);
  const awayLogo = teamLogo(away);

  return `
    <article class="match">
      <div class="match-top">
        <div class="league">${escapeHTML(leagueName)}</div>
        <div class="status ${status}">${labels[status]}</div>
      </div>

      <div class="teams">
        <div class="team">
          ${homeLogo ? `<img src="${escapeHTML(homeLogo)}" alt="" onerror="this.style.display='none'">` : ""}
          <span class="team-name">${escapeHTML(teamName(home))}</span>
        </div>

        <div class="score">${score}</div>

        <div class="team away">
          <span class="team-name">${escapeHTML(teamName(away))}</span>
          ${awayLogo ? `<img src="${escapeHTML(awayLogo)}" alt="" onerror="this.style.display='none'">` : ""}
        </div>
      </div>

      <div class="match-time">${escapeHTML(matchTime(match))}</div>
    </article>
  `;
}

function render() {
  const filtered = state.matches.filter(match => {
    const status = statusOf(match);

    if (state.tab === "all") return true;
    return status === state.tab;
  });

  const names = {
    all: "Semua Pertandingan",
    live: "Live Match",
    upcoming: "Akan Datang",
    finished: "Pertandingan Selesai"
  };

  $("sectionName").textContent = names[state.tab];
  $("matchCount").textContent =
    `${filtered.length} pertandingan`;

  if (!filtered.length) {
    $("matches").innerHTML = `
      <div class="empty">
        Belum ada pertandingan pada kategori ini.
      </div>
    `;
    return;
  }

  $("matches").innerHTML = filtered
    .map(matchCard)
    .join("");
}

async function loadMatches() {
  $("matches").innerHTML =
    `<div class="loading">Mengambil data pertandingan...</div>`;

  try {
    const result = await api("hl-matches", {
      date: jakartaDate(),
      limit: "100"
    });

    state.matches = getArray(result);
    render();

    if (!state.matches.length) {
      $("matches").innerHTML = `
        <div class="empty">
          API berhasil dihubungi, tetapi belum ada pertandingan
          yang dikembalikan untuk tanggal ini.
        </div>
      `;
    }

  } catch (error) {
    $("matches").innerHTML = `
      <div class="error">
        Gagal memuat data: ${escapeHTML(error.message)}
      </div>
    `;
  }
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(item => {
      item.classList.remove("active");
    });

    button.classList.add("active");
    state.tab = button.dataset.tab;
    render();
  });
});

showDate();
loadMatches();

setInterval(loadMatches, 60000);
</script>

</body>
</html>
