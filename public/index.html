<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>Football Forum</title>

  <style>
    :root {
      --bg: #090909;
      --panel: #171717;
      --panel2: #202020;
      --red: #f1263c;
      --text: #f5f5f5;
      --muted: #999;
      --border: #303030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 5%;
      background: #111;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      flex-shrink: 0;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand span {
      color: var(--red);
    }

    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .nav-links button {
      border: 0;
      background: none;
      color: #aaa;
      font-weight: 800;
      font-size: 14px;
      padding: 8px 0;
    }

    .nav-links button.active,
    .nav-links button:hover {
      color: white;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 30px 0 70px;
    }

    .hero {
      min-height: 270px;
      padding: 30px;
      border: 1px solid #70232e;
      border-radius: 28px;
      background:
        radial-gradient(circle at top right, #52202a 0, transparent 55%),
        linear-gradient(120deg, #391219, #171313);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .hero-label {
      text-align: center;
      color: #ccc;
      font-size: 17px;
    }

    .hero-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    .hero-team {
      min-width: 0;
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .hero-vs {
      font-size: 27px;
      font-weight: 900;
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      color: #bbb;
      font-size: 14px;
    }

    .section {
      margin-top: 45px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      font-size: 25px;
      font-weight: 900;
    }

    .section-title::before {
      content: "";
      display: block;
      width: 8px;
      height: 42px;
      border-radius: 10px;
      background: var(--red);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 55px 15px;
      font-size: 17px;
    }

    .match-list {
      display: grid;
      gap: 14px;
    }

    .match-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      transition: .2s;
      cursor: pointer;
    }

    .match-card:hover {
      border-color: var(--red);
      transform: translateY(-2px);
    }

    .match-league {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 17px;
    }

    .match-content {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .team.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team-name {
      font-size: 14px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .team-logo {
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .team-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #303030;
      color: white;
      font-size: 11px;
      font-weight: 900;
    }

    .score {
      min-width: 65px;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 17px;
      color: var(--muted);
      font-size: 12px;
    }

    .live {
      color: var(--red);
      font-weight: 900;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 25px;
    }

    .filters input,
    .filters select {
      background: var(--panel);
      color: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      min-width: 150px;
    }

    .league-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .league-card {
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
    }

    .league-card:hover {
      border-color: var(--red);
    }

    .league-card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .league-card p {
      color: var(--muted);
      margin: 0;
      font-size: 13px;
    }

    .detail-top {
      margin-bottom: 20px;
    }

    .back-button {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 17px;
    }

    .detail-score {
      padding: 30px 15px;
      background: linear-gradient(130deg, #391219, #171313);
      border: 1px solid #70232e;
      border-radius: 20px;
      text-align: center;
      margin: 20px 0;
    }

    .detail-score .match-content {
      max-width: 650px;
      margin: auto;
    }

    .detail-score .team {
      flex-direction: column;
      text-align: center;
    }

    .detail-score .team-logo,
    .detail-score .team-fallback {
      width: 55px;
      height: 55px;
    }

    .detail-score .team-name {
      font-size: 15px;
    }

    .detail-score .score {
      font-size: 30px;
    }

    .detail-info {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 18px;
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-row span:first-child {
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th, td {
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th {
      color: var(--muted);
      font-size: 11px;
    }

    td:nth-child(2),
    th:nth-child(2) {
      text-align: left;
    }

    .loading {
      text-align: center;
      padding: 55px 15px;
      color: var(--muted);
    }

    .error {
      padding: 16px;
      background: #35151a;
      border: 1px solid #8a2837;
      border-radius: 12px;
      color: #ffb5bf;
      margin: 15px 0;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 25px 5%;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 20px 4%;
        gap: 12px;
        overflow-x: auto;
      }

      .brand {
        font-size: 22px;
      }

      .nav-links {
        gap: 17px;
      }

      .nav-links button {
        font-size: 12px;
      }

      .container {
        width: 92%;
        padding-top: 22px;
      }

      .hero {
        min-height: 245px;
        padding: 22px 15px;
      }

      .hero-team {
        font-size: 15px;
      }

      .section-title {
        font-size: 22px;
      }

      .league-grid {
        grid-template-columns: 1fr;
      }

      .team {
        gap: 6px;
      }

      .team-name {
        font-size: 12px;
      }

      .team-logo,
      .team-fallback {
        width: 29px;
        height: 29px;
      }

      .score {
        min-width: 48px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="brand">FOOTBALL<span>FORUM</span></div>

    <nav class="nav-links">
      <button id="nav-home" class="active" onclick="showPage('home')">HOME</button>
      <button id="nav-matches" onclick="showPage('matches')">MATCHES</button>
      <button id="nav-leagues" onclick="showPage('leagues')">LEAGUES</button>
    </nav>
  </header>

  <main class="container">
    <div id="app">
      <div class="loading">Memuat Football Forum...</div>
    </div>
  </main>

  <footer class="footer">
    FOOTBALL FORUM · Football information and match centre
  </footer>

  <script>
    const API = "/api/football";

    const LEAGUES = [
      { id: "PL", name: "Premier League", country: "England" },
      { id: "ELC", name: "Championship", country: "England" },
      { id: "BL1", name: "Bundesliga", country: "Germany" },
      { id: "SA", name: "Serie A", country: "Italy" },
      { id: "PD", name: "La Liga", country: "Spain" },
      { id: "FL1", name: "Ligue 1", country: "France" },
      { id: "DED", name: "Eredivisie", country: "Netherlands" },
      { id: "PPL", name: "Primeira Liga", country: "Portugal" },
      { id: "BSA", name: "Brasileirão", country: "Brazil" },
      { id: "CL", name: "UEFA Champions League", country: "Europe" },
      { id: "EC", name: "European Championship", country: "Europe" },
      { id: "WC", name: "FIFA World Cup", country: "World" }
    ];

    let currentPage = "home";
    let selectedDate = jakartaDate();
    let selectedLeague = "ALL";
    let currentMatch = null;

    const app = document.getElementById("app");

    function jakartaDate() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Jakarta",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());

      return parts;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    async function api(params = {}) {
      const query = new URLSearchParams(params);

      const response = await fetch(`${API}?${query.toString()}`);
      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.error || "Gagal mengambil data.");
      }

      return result.data;
    }

    function formatDate(date) {
      if (!date) return "-";

      return new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(new Date(date));
    }

    function formatTime(date) {
      if (!date) return "-";

      return new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date(date));
    }

    function initials(name) {
      return String(name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(word => word[0])
        .join("")
        .toUpperCase();
    }

    function teamLogo(url, name) {
      if (url) {
        return `
          <img
            class="team-logo"
            src="${escapeHTML(url)}"
            alt="${escapeHTML(name)}"
            loading="lazy"
            onerror="this.outerHTML='<span class=&quot;team-fallback&quot;>${initials(name)}</span>'"
          >
        `;
      }

      return `
        <span class="team-fallback">
          ${escapeHTML(initials(name))}
        </span>
      `;
    }

    function matchStatus(match) {
      if (match.live) {
        return `<span class="live">● LIVE</span>`;
      }

      if (match.finished) {
        return "FULL TIME";
      }

      if (match.status === "POSTPONED") {
        return "POSTPONED";
      }

      if (match.status === "CANCELLED") {
        return "CANCELLED";
      }

      return formatTime(match.date);
    }

    function matchScore(match) {
      if (
        match.homeScore !== null &&
        match.homeScore !== undefined &&
        match.awayScore !== null &&
        match.awayScore !== undefined
      ) {
        return `${match.homeScore} - ${match.awayScore}`;
      }

      return "VS";
    }

    function matchCard(match) {
      return `
        <article class="match-card" onclick="openMatch(${Number(match.id)})">
          <div class="match-league">
            ${escapeHTML(match.league)}
            ${match.country ? " · " + escapeHTML(match.country) : ""}
          </div>

          <div class="match-content">
            <div class="team">
              ${teamLogo(match.homeLogo, match.home)}
              <span class="team-name">${escapeHTML(match.home)}</span>
            </div>

            <div class="score">${escapeHTML(matchScore(match))}</div>

            <div class="team away">
              <span class="team-name">${escapeHTML(match.away)}</span>
              ${teamLogo(match.awayLogo, match.away)}
            </div>
          </div>

          <div class="match-meta">
            <span>${escapeHTML(match.stage || (match.matchday ? "Matchday " + match.matchday : "Football Match"))}</span>
            <span>${matchStatus(match)}</span>
          </div>
        </article>
      `;
    }

    function sectionTitle(title) {
      return `<h2 class="section-title">${escapeHTML(title)}</h2>`;
    }

    function setActiveNav(page) {
      document.querySelectorAll(".nav-links button").forEach(button => {
        button.classList.remove("active");
      });

      const active = document.getElementById(`nav-${page}`);

      if (active) active.classList.add("active");
    }

    async function showPage(page) {
      currentPage = page;
      currentMatch = null;
      setActiveNav(page);

      app.innerHTML = `<div class="loading">Memuat data...</div>`;

      try {
        if (page === "home") {
          await renderHome();
        } else if (page === "matches") {
          await renderMatches();
        } else if (page === "leagues") {
          renderLeagues();
        }
      } catch (error) {
        showError(error);
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function renderHome() {
      const data = await api({
        type: "home",
        date: selectedDate
      });

      const matches = data.matches || [];
      const live = matches.filter(match => match.live);

      const featured = matches.find(match => !match.finished) || matches[0];

      app.innerHTML = `
        ${featured ? `
          <section class="hero">
            <div class="hero-label">
              ${escapeHTML(featured.league)} · ${formatDate(featured.date)}
            </div>

            <div class="hero-teams">
              <div class="hero-team">${escapeHTML(featured.home)}</div>
              <div class="hero-vs">VS</div>
              <div class="hero-team">${escapeHTML(featured.away)}</div>
            </div>

            <div class="hero-bottom">
              <span>${featured.finished ? "FULL TIME" : "MATCH DAY"}</span>
              <span>${escapeHTML(matchScore(featured))}</span>
            </div>
          </section>
        ` : ""}

        <section class="section">
          ${sectionTitle("LIVE MATCHES")}

          ${live.length
            ? `<div class="match-list">${live.map(matchCard).join("")}</div>`
            : `<div class="empty">Tidak ada pertandingan live saat ini.</div>`
          }
        </section>

        <section class="section">
          ${sectionTitle("TODAY'S MATCHES")}

          ${matches.length
            ? `<div class="match-list">${matches.map(matchCard).join("")}</div>`
            : `<div class="empty">Tidak ada jadwal pertandingan pada tanggal ini.</div>`
          }
        </section>
      `;
    }

    async function renderMatches() {
      app.innerHTML = `
        ${sectionTitle("MATCHES")}

        <div class="filters">
          <input
            type="date"
            id="date-filter"
            value="${selectedDate}"
            onchange="changeDate(this.value)"
          >

          <select id="league-filter" onchange="changeLeague(this.value)">
            <option value="ALL">All competitions</option>
            ${LEAGUES.map(league => `
              <option value="${league.id}" ${selectedLeague === league.id ? "selected" : ""}>
                ${escapeHTML(league.name)}
              </option>
            `).join("")}
          </select>
        </div>

        <div id="matches-results">
          <div class="loading">Memuat pertandingan...</div>
        </div>
      `;

      await loadMatches();
    }

    async function loadMatches() {
      const results = document.getElementById("matches-results");

      if (!results) return;

      results.innerHTML = `<div class="loading">Memuat pertandingan...</div>`;

      try {
        const matches = await api({
          type: "matches",
          dateFrom: selectedDate,
          dateTo: selectedDate,
          league: selectedLeague
        });

        results.innerHTML = matches.length
          ? `<div class="match-list">${matches.map(matchCard).join("")}</div>`
          : `<div class="empty">Tidak ada pertandingan ditemukan.</div>`;

      } catch (error) {
        results.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
      }
    }

    function changeDate(value) {
      if (!value) return;

      selectedDate = value;
      loadMatches();
    }

    function changeLeague(value) {
      selectedLeague = value;
      loadMatches();
    }

    function renderLeagues() {
      app.innerHTML = `
        ${sectionTitle("LEAGUES")}

        <div class="league-grid">
          ${LEAGUES.map(league => `
            <article class="league-card" onclick="openLeague('${league.id}')">
              <h3>${escapeHTML(league.name)}</h3>
              <p>${escapeHTML(league.country)}</p>
            </article>
          `).join("")}
        </div>
      `;
    }

    async function openLeague(code) {
      const league = LEAGUES.find(item => item.id === code);

      if (!league) return;

      currentPage = "league-detail";
      app.innerHTML = `<div class="loading">Memuat klasemen...</div>`;

      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        const data = await api({
          type: "standings",
          league: code
        });

        const table = data.standings?.find(
          item => item.type === "TOTAL"
        ) || data.standings?.[0];

        const rows = table?.table || [];

        app.innerHTML = `
          <div class="detail-top">
            <button class="back-button" onclick="showPage('leagues')">
              ← Kembali ke Leagues
            </button>
          </div>

          ${sectionTitle(league.name)}

          ${rows.length ? `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>TEAM</th>
                    <th>MP</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GD</th>
                    <th>PTS</th>
                  </tr>
                </thead>

                <tbody>
                  ${rows.map(row => `
                    <tr>
                      <td>${row.position}</td>
                      <td>${escapeHTML(row.team?.shortName || row.team?.name || "-")}</td>
                      <td>${row.playedGames}</td>
                      <td>${row.won}</td>
                      <td>${row.draw}</td>
                      <td>${row.lost}</td>
                      <td>${row.goalDifference}</td>
                      <td><strong>${row.points}</strong></td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="empty">Klasemen belum tersedia untuk kompetisi ini.</div>
          `}
        `;

      } catch (error) {
        showError(error, "leagues");
      }
    }

    async function openMatch(id) {
      currentPage = "match-detail";
      app.innerHTML = `<div class="loading">Memuat detail pertandingan...</div>`;

      window.scrollTo({ top: 0, behavior: "smooth" });

      try {
        const data = await api({
          type: "match",
          id
        });

        currentMatch = data.fixture;

        const match = data.fixture;
        const score = data.score || {};
        const goals = data.goals || [];
        const bookings = data.bookings || [];
        const substitutions = data.substitutions || [];

        const homeName = match.home;
        const awayName = match.away;

        app.innerHTML = `
          <div class="detail-top">
            <button class="back-button" onclick="showPage('matches')">
              ← Kembali ke Matches
            </button>
          </div>

          <div class="detail-score">
            <div class="match-league">
              ${escapeHTML(match.league)} · ${formatDate(match.date)}
            </div>

            <div class="match-content">
              <div class="team">
                ${teamLogo(match.homeLogo, homeName)}
                <span class="team-name">${escapeHTML(homeName)}</span>
              </div>

              <div>
                <div class="score">${escapeHTML(matchScore(match))}</div>
                <div class="match-meta" style="justify-content:center">
                  ${matchStatus(match)}
                </div>
              </div>

              <div class="team">
                ${teamLogo(match.awayLogo, awayName)}
                <span class="team-name">${escapeHTML(awayName)}</span>
              </div>
            </div>
          </div>

          ${sectionTitle("MATCH INFORMATION")}

          <div class="detail-info">
            ${infoRow("Competition", match.league)}
            ${infoRow("Date", formatDate(match.date))}
            ${infoRow("Kick-off", formatTime(match.date))}
            ${infoRow("Status", match.status)}
            ${infoRow("Matchday", match.matchday || "-")}
            ${infoRow("Venue", match.venue || "Not available")}
            ${infoRow("Referee", match.referee || "Not available")}
          </div>

          ${sectionTitle("GOALS")}

          <div class="detail-info">
            ${goals.length
              ? goals.map(goal => infoRow(
                  `${goal.minute ?? "-"}'`,
                  `${goal.scorer?.name || "Goal"} · ${goal.team?.name || ""}`
                )).join("")
              : `<div class="empty">Informasi gol belum tersedia.</div>`
            }
          </div>

          ${sectionTitle("OTHER MATCH EVENTS")}

          <div class="detail-info">
            ${bookings.length || substitutions.length
              ? [
                  ...bookings.map(item => infoRow(
                    `${item.minute ?? "-"}'`,
                    `${item.player?.name || "Player"} · ${item.card || "Card"}`
                  )),
                  ...substitutions.map(item => infoRow(
                    `${item.minute ?? "-"}'`,
                    `Substitution · ${item.playerOut?.name || "-"} → ${item.playerIn?.name || "-"}`
                  ))
                ].join("")
              : `<div class="empty">Informasi kartu dan pergantian pemain belum tersedia.</div>`
            }
          </div>
        `;

      } catch (error) {
        showError(error, "matches");
      }
    }

    function infoRow(label, value) {
      return `
        <div class="info-row">
          <span>${escapeHTML(label)}</span>
          <strong>${escapeHTML(value || "-")}</strong>
        </div>
      `;
    }

    function showError(error, backPage = "home") {
      app.innerHTML = `
        <div class="error">
          <strong>Terjadi kesalahan</strong>
          <p>${escapeHTML(error.message || "Gagal memuat data.")}</p>
        </div>

        <button class="back-button" onclick="showPage('${backPage}')">
          ← Kembali
        </button>
      `;
    }

    showPage("home");
  </script>
</body>
</html>
