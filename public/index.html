
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Football Forum</title>

<style>
:root {
  --bg: #090909;
  --panel: #141414;
  --panel2: #1c1c1c;
  --border: #292929;
  --red: #e32936;
  --text: #f5f5f5;
  --muted: #929292;
  --green: #35cf83;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button, input, select { font: inherit; }

button { cursor: pointer; }

header {
  height: 68px;
  padding: 0 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #101010;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span { color: var(--red); }

nav {
  display: flex;
  gap: 25px;
}

nav button {
  background: none;
  border: 0;
  color: #aaa;
  font-size: 13px;
  font-weight: bold;
}

nav button.active,
nav button:hover { color: white; }

.container {
  width: min(1180px, 92%);
  margin: 25px auto;
}

.section-title {
  font-size: 19px;
  font-weight: 800;
  margin: 25px 0 15px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.section-title:before {
  content: "";
  width: 4px;
  height: 20px;
  background: var(--red);
  border-radius: 5px;
}

.muted { color: var(--muted); }

.search {
  width: 100%;
  padding: 13px 15px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  outline: none;
  margin-bottom: 15px;
}

.search:focus { border-color: var(--red); }

/* POSTER SLIDER */

.poster-shell {
  position: relative;
  overflow: hidden;
  border-radius: 14px;
}

.poster-track {
  display: flex;
  transition: transform .4s ease;
}

.poster {
  min-width: 100%;
  height: 270px;
  padding: 25px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, #3a1015, transparent 55%),
    linear-gradient(120deg, #171717, #320b10 55%, #101010);
  border: 1px solid #542026;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.poster:before {
  content: "";
  position: absolute;
  width: 180%;
  height: 150%;
  top: -25%;
  left: -30%;
  transform: rotate(-18deg);
  background: repeating-linear-gradient(
    90deg,
    transparent 0 70px,
    rgba(255,255,255,.035) 70px 110px
  );
  pointer-events: none;
}

.poster-top,
.poster-match,
.poster-bottom {
  position: relative;
  z-index: 1;
}

.poster-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

.poster-label {
  color: #ff6570;
}

.poster-match {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  text-align: center;
  gap: 12px;
}

.club-crest {
  width: 75px;
  height: 75px;
  margin: auto auto 10px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #202020;
  border: 2px solid #777;
  font-size: 23px;
  font-weight: 900;
}

.club-name {
  font-weight: 900;
  font-size: 15px;
}

.poster-vs {
  color: #ff5a65;
  font-size: 23px;
  font-weight: 900;
}

.poster-date {
  font-size: 12px;
  color: #ddd;
  text-align: center;
  margin-top: 8px;
}

.poster-bottom {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 1px;
  color: #bbb;
}

.slider-dots {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-top: 13px;
}

.slider-dot {
  width: 7px;
  height: 7px;
  border: 0;
  border-radius: 10px;
  background: #555;
  padding: 0;
}

.slider-dot.active {
  width: 23px;
  background: var(--red);
}

/* MATCHES */

.match-list {
  display: grid;
  gap: 9px;
}

.match-row {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px;
  display: grid;
  grid-template-columns: 75px 1fr 65px;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.match-row:hover {
  border-color: #733038;
  background: #191313;
}

.match-time {
  color: var(--muted);
  font-size: 12px;
}

.match-teams {
  display: grid;
  gap: 7px;
  font-size: 13px;
  font-weight: bold;
}

.match-score {
  text-align: right;
  font-weight: 900;
  line-height: 1.8;
}

.live {
  color: var(--green);
  font-size: 10px;
}

/* LEAGUES */

.country-block {
  margin-bottom: 20px;
}

.country-heading {
  padding: 12px 14px;
  background: #181818;
  border: 1px solid var(--border);
  border-radius: 9px 9px 0 0;
  font-weight: bold;
  font-size: 14px;
}

.league-row {
  padding: 13px 15px;
  border: 1px solid var(--border);
  border-top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #111;
  cursor: pointer;
  font-size: 13px;
}

.league-row:last-child { border-radius: 0 0 9px 9px; }
.league-row:hover { background: #202020; }

.league-arrow { color: var(--muted); }

/* PAGES */

.page { display: none; }
.page.active { display: block; }

.back-btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  padding: 9px 13px;
  border-radius: 7px;
  margin-bottom: 17px;
}

.tabs {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin: 17px 0;
  padding-bottom: 5px;
}

.tab {
  white-space: nowrap;
  border: 1px solid var(--border);
  background: var(--panel);
  color: #aaa;
  padding: 10px 14px;
  border-radius: 7px;
  font-size: 12px;
}

.tab.active {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}

.detail-score {
  text-align: center;
  padding: 25px 10px;
  background: linear-gradient(120deg, #1d1012, #171717);
  border: 1px solid #482126;
  border-radius: 12px;
}

.detail-score .score {
  font-size: 36px;
  font-weight: 900;
  margin: 12px;
}

.detail-teams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  font-weight: bold;
}

.stat-row {
  margin: 15px 0;
}

.stat-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 7px;
}

.stat-bars {
  display: flex;
  height: 7px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.stat-home { background: var(--red); }
.stat-away { background: #777; }

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 430px;
}

th, td {
  padding: 11px 8px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

th {
  color: var(--muted);
  font-weight: normal;
}

td:first-child, th:first-child { text-align: left; }

.player-row {
  display: flex;
  justify-content: space-between;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.rating {
  color: #ffd36a;
  font-weight: bold;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 25px 10px;
  font-size: 13px;
}

.loading {
  color: var(--muted);
  padding: 25px;
  text-align: center;
}

.error {
  color: #ff8585;
  font-size: 13px;
  padding: 12px 0;
}

footer {
  border-top: 1px solid var(--border);
  padding: 25px 5%;
  margin-top: 50px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

@media (max-width: 650px) {
  header { padding: 0 4%; height: 60px; }
  .logo { font-size: 19px; }
  nav { gap: 13px; }
  nav button { font-size: 11px; padding: 5px 0; }
  .container { width: 92%; margin-top: 18px; }
  .poster { height: 245px; padding: 18px; }
  .club-crest { width: 62px; height: 62px; font-size: 19px; }
  .club-name { font-size: 12px; }
  .match-row { grid-template-columns: 58px 1fr 45px; gap: 7px; padding: 11px 8px; }
  .match-teams { font-size: 11px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">FOOTBALL<span>FORUM</span></div>
  <nav>
    <button class="active" data-page="home">HOME</button>
    <button data-page="matches">MATCHES</button>
    <button data-page="leagues">LEAGUES</button>
  </nav>
</header>

<main class="container">

  <!-- HOME -->
  <section id="home" class="page active">
    <div class="section-title">FEATURED MATCHES</div>
    <div class="poster-shell">
      <div id="posterTrack" class="poster-track">
        <div class="poster">
          <div class="loading">Memuat pertandingan...</div>
        </div>
      </div>
    </div>
    <div id="posterDots" class="slider-dots"></div>

    <div class="section-title">LIVE MATCHES</div>
    <div id="liveMatches" class="match-list">
      <div class="loading">Memuat pertandingan...</div>
    </div>

    <div class="section-title">TODAY'S MATCHES</div>
    <div id="todayMatches" class="match-list">
      <div class="loading">Memuat pertandingan...</div>
    </div>

    <div class="section-title">POPULAR LEAGUES</div>
    <div id="homeLeagues"></div>
  </section>

  <!-- MATCHES -->
  <section id="matches" class="page">
    <div class="section-title">ALL MATCHES</div>
    <input id="matchDate" class="search" type="date">
    <div id="allMatches" class="match-list">
      <div class="loading">Memuat pertandingan...</div>
    </div>
  </section>

  <!-- LEAGUES -->
  <section id="leagues" class="page">
    <div class="section-title">LEAGUES BY COUNTRY</div>
    <input id="leagueSearch" class="search" placeholder="Cari negara atau liga...">
    <div id="leagueList">
      <div class="loading">Memuat liga...</div>
    </div>
  </section>

  <!-- LEAGUE DETAIL -->
  <section id="leagueDetail" class="page">
    <button class="back-btn" onclick="showPage('leagues')">← Kembali ke liga</button>
    <div id="leagueHeading" class="section-title">League</div>
    <div class="tabs">
      <button class="tab active" data-league-tab="matches">Matches</button>
      <button class="tab" data-league-tab="standings">Standings</button>
    </div>
    <div id="leagueContent"></div>
  </section>

  <!-- MATCH DETAIL -->
  <section id="matchDetail" class="page">
    <button class="back-btn" onclick="showPage('home')">← Kembali</button>
    <div id="matchHeading"></div>
    <div class="tabs" id="matchTabs">
      <button class="tab active" data-match-tab="statistics">Statistics</button>
      <button class="tab" data-match-tab="lineups">Lineups</button>
      <button class="tab" data-match-tab="players">Player Ratings</button>
      <button class="tab" data-match-tab="h2h">H2H</button>
      <button class="tab" data-match-tab="form">Team Form</button>
      <button class="tab" data-match-tab="predictions">Predictions</button>
    </div>
    <div id="matchContent"></div>
  </section>

</main>

<footer>
  FOOTBALL FORUM · Football data from API-Football and OpenFootball
</footer>

<script>
"use strict";

const API = "/api/football";

const state = {
  leagues: [],
  matches: [],
  posters: [],
  currentLeague: null,
  currentMatch: null,
  posterIndex: 0,
  leagueTab: "matches",
  matchTab: "statistics"
};

const $ = (id) => document.getElementById(id);

async function api(type, params = {}) {
  const query = new URLSearchParams({ type, ...params });
  const response = await fetch(`${API}?${query}`);
  if (!response.ok) throw new Error("Gagal mengambil data server");
  const result = await response.json();
  if (!result.ok) throw new Error(result.error || "Data tidak tersedia");
  return result.data;
}

function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  $(id).classList.add("active");

  document.querySelectorAll("nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.page === id);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function initials(name) {
  return String(name || "?")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return safe(value);
  return date.toLocaleDateString("id-ID", {
    day: "numeric",
    month: "short",
    year: "numeric",
    timeZone: "Asia/Jakarta"
  });
}

function formatTime(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return date.toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Asia/Jakarta"
  });
}

function scoreText(match) {
  if (match.homeScore == null || match.awayScore == null) return "-";
  return `${match.homeScore} - ${match.awayScore}`;
}

function matchRow(match) {
  const live = match.live
    ? '<span class="live">● LIVE</span>'
    : "";

  return `
    <div class="match-row" data-match-id="${safe(match.id)}">
      <div class="match-time">
        ${match.live ? live : safe(formatTime(match.date))}
        <div>${safe(match.status || "")}</div>
      </div>
      <div class="match-teams">
        <div>${safe(match.home)}</div>
        <div>${safe(match.away)}</div>
      </div>
      <div class="match-score">
        ${safe(scoreText(match))}
      </div>
    </div>`;
}

function attachMatchClicks(root) {
  root.querySelectorAll("[data-match-id]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.matchId;
      if (id && !String(id).startsWith("open:")) openMatch(id);
    });
  });
}

/* POSTER SLIDER */

function makePoster(match) {
  const home = safe(match.home || "HOME");
  const away = safe(match.away || "AWAY");
  const date = formatDate(match.date);

  return `
    <article class="poster">
      <div class="poster-top">
        <span>FOOTBALL FORUM</span>
        <span class="poster-label">MATCH DAY</span>
      </div>

      <div>
        <div class="poster-match">
          <div>
            <div class="club-crest">${safe(initials(match.home))}</div>
            <div class="club-name">${home}</div>
          </div>
          <div class="poster-vs">VS</div>
          <div>
            <div class="club-crest">${safe(initials(match.away))}</div>
            <div class="club-name">${away}</div>
          </div>
        </div>
        <div class="poster-date">
          ${safe(match.league || "FOOTBALL")} · ${safe(date)}
        </div>
      </div>

      <div class="poster-bottom">
        <span>${safe(match.country || "INTERNATIONAL")}</span>
        <span>${match.finished ? safe(scoreText(match)) : "KICK OFF TIME TBA"}</span>
      </div>
    </article>`;
}

function renderPosters(items) {
  state.posters = items || [];
  state.posterIndex = 0;

  if (!state.posters.length) {
    $("posterTrack").innerHTML = `
      <div class="poster"><div class="empty">
        Belum ada data poster pertandingan.
      </div></div>`;
    $("posterDots").innerHTML = "";
    return;
  }

  $("posterTrack").innerHTML = state.posters.map(makePoster).join("");

  $("posterDots").innerHTML = state.posters.map((_, i) => `
    <button class="slider-dot ${i === 0 ? "active" : ""}"
      aria-label="Poster ${i + 1}" data-dot="${i}"></button>
  `).join("");

  $("posterDots").querySelectorAll("[data-dot]").forEach(dot => {
    dot.addEventListener("click", () => {
      setPoster(Number(dot.dataset.dot));
    });
  });

  let startX = 0;
  const track = $("posterTrack");

  track.ontouchstart = e => {
    startX = e.touches[0].clientX;
  };

  track.ontouchend = e => {
    const diff = e.changedTouches[0].clientX - startX;
    if (Math.abs(diff) < 40) return;
    const next = diff < 0
      ? state.posterIndex + 1
      : state.posterIndex - 1;
    setPoster((next + state.posters.length) % state.posters.length);
  };
}

function setPoster(index) {
  if (!state.posters.length) return;
  state.posterIndex = index;
  $("posterTrack").style.transform = `translateX(-${index * 100}%)`;

  $("posterDots").querySelectorAll(".slider-dot").forEach((dot, i) => {
    dot.classList.toggle("active", i === index);
  });
}

/* LEAGUES */

function renderLeagues(leagues, target) {
  const groups = {};

  (leagues || []).forEach(league => {
    const country = league.country || "Other";
    if (!groups[country]) groups[country] = {
      flag: league.flag || "🌍",
      leagues: []
    };
    groups[country].leagues.push(league);
  });

  const countries = Object.keys(groups).sort();

  if (!countries.length) {
    $(target).innerHTML = '<div class="empty">Data liga belum tersedia.</div>';
    return;
  }

  $(target).innerHTML = countries.map(country => `
    <div class="country-block">
      <div class="country-heading">
        ${safe(groups[country].flag)} ${safe(country)}
      </div>
      ${groups[country].leagues.map(league => `
        <div class="league-row" data-league-id="${safe(league.id)}">
          <span>${safe(league.name)}</span>
          <span class="league-arrow">›</span>
        </div>
      `).join("")}
    </div>
  `).join("");

  $(target).querySelectorAll("[data-league-id]").forEach(row => {
    row.addEventListener("click", () => {
      const league = leagues.find(x =>
        String(x.id) === row.dataset.leagueId
      );
      if (league) openLeague(league);
    });
  });
}

async function openLeague(league) {
  state.currentLeague = league;
  state.leagueTab = "matches";

  $("leagueHeading").textContent =
    `${league.flag || "🌍"} ${league.name}`;

  document.querySelectorAll("[data-league-tab]").forEach(b => {
    b.classList.toggle("active", b.dataset.leagueTab === "matches");
  });

  showPage("leagueDetail");
  await loadLeagueTab();
}

async function loadLeagueTab() {
  const league = state.currentLeague;
  if (!league) return;

  $("leagueContent").innerHTML = '<div class="loading">Memuat data...</div>';

  try {
    if (state.leagueTab === "matches") {
      const date = $("matchDate").value || new Date().toISOString().slice(0, 10);
      const data = await api("matches", {
        date,
        league: league.id,
        season: league.season || new Date().getFullYear()
      });

      $("leagueContent").innerHTML = data.length
        ? `<div class="match-list">${data.map(matchRow).join("")}</div>`
        : '<div class="empty">Tidak ada pertandingan pada tanggal ini.</div>';

      attachMatchClicks($("leagueContent"));
    } else {
      const data = await api("standings", {
        league: league.id,
        season: league.season || new Date().getFullYear()
      });
      renderStandings(data, $("leagueContent"));
    }
  } catch (error) {
    $("leagueContent").innerHTML =
      `<div class="error">${safe(error.message)}</div>`;
  }
}

function renderStandings(data, target) {
  const standings = Array.isArray(data) ? data : [];
  const rows = standings.flatMap(group =>
    Array.isArray(group) ? group : [group]
  ).filter(Boolean);

  if (!rows.length) {
    target.innerHTML = '<div class="empty">Klasemen belum tersedia.</div>';
    return;
  }

  target.innerHTML = `
    <div class="panel table-wrap">
      <table>
        <thead><tr>
          <th>Club</th><th>P</th><th>W</th><th>D</th>
          <th>L</th><th>GD</th><th>PTS</th>
        </tr></thead>
        <tbody>
          ${rows.map(item => {
            const team = item.team || {};
            const all = item.all || {};
            return `<tr>
              <td>${safe(item.rank)}. ${safe(team.name || item.name)}</td>
              <td>${safe(all.played ?? item.played ?? "-")}</td>
              <td>${safe(all.win ?? item.win ?? "-")}</td>
              <td>${safe(all.draw ?? item.draw ?? "-")}</td>
              <td>${safe(all.lose ?? item.lose ?? "-")}</td>
              <td>${safe(item.goalsDiff ?? "-")}</td>
              <td><b>${safe(item.points ?? "-")}</b></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>`;
}

/* MATCH DETAIL */

async function openMatch(id) {
  state.currentMatch = state.matches.find(m => String(m.id) === String(id)) || { id };
  state.matchTab = "statistics";

  $("matchHeading").innerHTML = '<div class="loading">Memuat pertandingan...</div>';
  $("matchContent").innerHTML = '<div class="loading">Memuat detail...</div>';

  document.querySelectorAll("[data-match-tab]").forEach(b => {
    b.classList.toggle("active", b.dataset.matchTab === "statistics");
  });

  showPage("matchDetail");

  try {
    const data = await api("match", { id });
    state.currentMatch = { ...state.currentMatch, ...data.fixture };

    renderMatchHeading(state.currentMatch);
    await loadMatchTab();
  } catch (error) {
    $("matchContent").innerHTML =
      `<div class="error">${safe(error.message)}</div>`;
  }
}

function renderMatchHeading(match) {
  $("matchHeading").innerHTML = `
    <div class="detail-score">
      <div class="muted">${safe(match.league || "MATCH")}</div>
      <div class="detail-teams">
        <div>${safe(match.home || "Home")}</div>
        <div>${safe(match.away || "Away")}</div>
      </div>
      <div class="score">${safe(scoreText(match))}</div>
      <div class="muted">${safe(match.status || formatDate(match.date))}</div>
    </div>`;
}

async function loadMatchTab() {
  const m = state.currentMatch;
  if (!m) return;

  $("matchContent").innerHTML = '<div class="loading">Memuat data...</div>';

  try {
    if (state.matchTab === "h2h") {
      const data = await api("h2h", {
        team1: m.homeId,
        team2: m.awayId
      });
      renderGenericMatches(data, $("matchContent"));
      return;
    }

    if (state.matchTab === "form") {
      const [home, away] = await Promise.all([
        api("team-form", { team: m.homeId, season: m.season || new Date().getFullYear() }),
        api("team-form", { team: m.awayId, season: m.season || new Date().getFullYear() })
      ]);

      $("matchContent").innerHTML = `
        <div class="panel">
          <b>${safe(m.home)}</b>
          ${genericList(home)}
        </div>
        <div class="panel">
          <b>${safe(m.away)}</b>
          ${genericList(away)}
        </div>`;
      return;
    }

    const data = await api("match", { id: m.id });

    if (state.matchTab === "statistics") {
      renderStatistics(data.statistics, $("matchContent"));
    } else if (state.matchTab === "lineups") {
      renderLineups(data.lineups, $("matchContent"));
    } else if (state.matchTab === "players") {
      renderPlayers(data.players, $("matchContent"));
    } else if (state.matchTab === "predictions") {
      const prediction = await api("predictions", { fixture: m.id });
      renderPredictions(prediction, $("matchContent"));
    }
  } catch (error) {
    $("matchContent").innerHTML =
      `<div class="error">${safe(error.message)}</div>`;
  }
}

function renderStatistics(data, target) {
  const stats = Array.isArray(data) ? data : [];

  if (!stats.length) {
    target.innerHTML = '<div class="empty">Statistik belum tersedia. Biasanya data muncul saat pertandingan berlangsung.</div>';
    return;
  }

  const home = stats[0]?.statistics || [];
  const away = stats[1]?.statistics || [];

  target.innerHTML = `<div class="panel">
    ${home.map(item => {
      const other = away.find(x => x.type === item.type);
      const a = parseFloat(item.value) || 0;
      const b = parseFloat(other?.value) || 0;
      const total = a + b || 1;
      return `
        <div class="stat-row">
          <div class="stat-label">
            <b>${safe(item.value ?? "-")}</b>
            <span>${safe(item.type)}</span>
            <b>${safe(other?.value ?? "-")}</b>
          </div>
          <div class="stat-bars">
            <div class="stat-home" style="width:${a / total * 100}%"></div>
            <div class="stat-away" style="width:${b / total * 100}%"></div>
          </div>
        </div>`;
    }).join("")}
  </div>`;
}

function renderLineups(data, target) {
  if (!Array.isArray(data) || !data.length) {
    target.innerHTML = '<div class="empty">Lineup belum diumumkan oleh penyedia data.</div>';
    return;
  }

  target.innerHTML = data.map(team => `
    <div class="panel">
      <b>${safe(team.team?.name || "Team")}</b>
      <p class="muted">Formation: ${safe(team.formation || "-")}</p>
      ${(team.startXI || []).map(p => `
        <div class="player-row">
          <span>${safe(p.player?.number ?? "")} ${safe(p.player?.name || "Player")}</span>
          <span class="muted">${safe(p.player?.pos || "")}</span>
        </div>
      `).join("")}
      <p class="muted">Substitutes</p>
      ${(team.substitutes || []).map(p => `
        <div class="player-row">
          <span>${safe(p.player?.number ?? "")} ${safe(p.player?.name || "Player")}</span>
          <span class="muted">${safe(p.player?.pos || "")}</span>
        </div>
      `).join("")}
    </div>
  `).join("");
}

function renderPlayers(data, target) {
  if (!Array.isArray(data) || !data.length) {
    target.innerHTML = '<div class="empty">Rating pemain belum tersedia.</div>';
    return;
  }

  target.innerHTML = data.map(team => `
    <div class="panel">
      <b>${safe(team.team?.name || "Team")}</b>
      ${(team.players || []).map(p => `
        <div class="player-row">
          <span>${safe(p.player?.name || "Player")}</span>
          <span class="rating">${safe(p.statistics?.[0]?.games?.rating || "-")}</span>
        </div>
      `).join("")}
    </div>
  `).join("");
}

function renderPredictions(data, target) {
  const prediction = data?.predictions || data?.[0]?.predictions;

  if (!prediction) {
    target.innerHTML = '<div class="empty">Prediksi belum tersedia untuk pertandingan ini.</div>';
    return;
  }

  const winner = prediction.winner?.name || "Belum ditentukan";

  target.innerHTML = `
    <div class="panel">
      <h3>Match Prediction</h3>
      <p>Predicted winner: <b>${safe(winner)}</b></p>
      <p class="muted">${safe(prediction.advice || "")}</p>
      <p>Home: ${safe(prediction.percent?.home || "-")}</p>
      <p>Draw: ${safe(prediction.percent?.draw || "-")}</p>
      <p>Away: ${safe(prediction.percent?.away || "-")}</p>
    </div>`;
}

function renderGenericMatches(data, target) {
  const matches = Array.isArray(data) ? data : [];
  target.innerHTML = matches.length
    ? `<div class="match-list">${matches.map(matchRow).join("")}</div>`
    : '<div class="empty">Data pertandingan belum tersedia.</div>';
  attachMatchClicks(target);
}

function genericList(data) {
  const list = Array.isArray(data) ? data : [];
  if (!list.length) return '<div class="empty">Data belum tersedia.</div>';
  return `<div class="match-list">${list.map(item => `
    <div class="player-row">
      <span>${safe(item.home || item.teams?.home?.name || "-")} vs
        ${safe(item.away || item.teams?.away?.name || "-")}</span>
      <span>${safe(scoreText(item))}</span>
    </div>
  `).join("")}</div>`;
}

/* LOAD DATA */

async function loadHome() {
  try {
    const data = await api("home");

    state.leagues = data.leagues || [];
    state.matches = data.matches || [];

    renderPosters(data.posters || []);

    const live = state.matches.filter(m => m.live);
    $("liveMatches").innerHTML = live.length
      ? live.map(matchRow).join("")
      : '<div class="empty">Tidak ada pertandingan live saat ini.</div>';

    $("todayMatches").innerHTML = state.matches.length
      ? state.matches.map(matchRow).join("")
      : '<div class="empty">Jadwal pertandingan belum tersedia.</div>';

    renderLeagues(state.leagues.slice(0, 12), "homeLeagues");

    attachMatchClicks($("liveMatches"));
    attachMatchClicks($("todayMatches"));
  } catch (error) {
    const message = `<div class="error">${safe(error.message)}</div>`;
    $("liveMatches").innerHTML = message;
    $("todayMatches").innerHTML = message;
  }
}

async function loadMatches(date) {
  $("allMatches").innerHTML = '<div class="loading">Memuat pertandingan...</div>';

  try {
    const matches = await api("matches", { date });
    state.matches = matches || [];

    $("allMatches").innerHTML = state.matches.length
      ? state.matches.map(matchRow).join("")
      : '<div class="empty">Tidak ada pertandingan pada tanggal tersebut.</div>';

    attachMatchClicks($("allMatches"));
  } catch (error) {
    $("allMatches").innerHTML =
      `<div class="error">${safe(error.message)}</div>`;
  }
}

async function loadLeagues() {
  $("leagueList").innerHTML = '<div class="loading">Memuat liga...</div>';

  try {
    state.leagues = await api("leagues");
    renderLeagues(state.leagues, "leagueList");
  } catch (error) {
    $("leagueList").innerHTML =
      `<div class="error">${safe(error.message)}</div>`;
  }
}

/* EVENTS */

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", async () => {
    const page = button.dataset.page;
    showPage(page);

    if (page === "matches") {
      const date = $("matchDate").value ||
        new Date().toISOString().slice(0, 10);
      $("matchDate").value = date;
      await loadMatches(date);
    }

    if (page === "leagues") await loadLeagues();
  });
});

$("matchDate").value = new Date().toISOString().slice(0, 10);

$("matchDate").addEventListener("change", () => {
  loadMatches($("matchDate").value);
});

$("leagueSearch").addEventListener("input", event => {
  const query = event.target.value.toLowerCase();
  const filtered = state.leagues.filter(league =>
    `${league.country} ${league.name}`.toLowerCase().includes(query)
  );
  renderLeagues(filtered, "leagueList");
});

document.querySelectorAll("[data-league-tab]").forEach(button => {
  button.addEventListener("click", async () => {
    state.leagueTab = button.dataset.leagueTab;

    document.querySelectorAll("[data-league-tab]").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    await loadLeagueTab();
  });
});

document.querySelectorAll("[data-match-tab]").forEach(button => {
  button.addEventListener("click", async () => {
    state.matchTab = button.dataset.matchTab;

    document.querySelectorAll("[data-match-tab]").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    await loadMatchTab();
  });
});

/* START */

loadHome();
</script>

</body>
</html>
