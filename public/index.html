
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Football Center</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101827;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      background: #172337;
      border-bottom: 1px solid #29374c;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 0;
    }

    nav {
      display: flex;
      overflow-x: auto;
      gap: 9px;
      padding: 14px;
      background: #172337;
    }

    nav button {
      white-space: nowrap;
      background: #29374c;
      border: 0;
      color: white;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
    }

    nav button.active {
      background: #16a36a;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    .section-title {
      font-size: 18px;
      margin: 25px 0 12px;
    }

    .match {
      background: #1b293d;
      border: 1px solid #2d3c52;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 11px;
    }

    .league {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 13px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .team img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .team-name {
      font-size: 13px;
      font-weight: bold;
    }

    .score {
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      color: #34d399;
      font-size: 11px;
      margin-top: 7px;
    }

    .muted {
      color: #94a3b8;
      font-size: 12px;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #94a3b8;
      background: #1b293d;
      border-radius: 12px;
    }

    .detail-button {
      display: block;
      width: 100%;
      margin-top: 13px;
      padding: 10px;
      background: #29374c;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .detail {
      background: #1b293d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .detail pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #cbd5e1;
      font-size: 12px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    .error {
      color: #fca5a5;
      background: #451f2a;
      padding: 14px;
      border-radius: 9px;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>⚽ Football Center</h1>
    <p>Football statistics, fixtures and match center</p>
  </header>

  <nav>
    <button class="active" data-page="home">Beranda</button>
    <button data-page="live">Live Score</button>
    <button data-page="matches">Jadwal</button>
    <button data-page="leagues">Liga</button>
    <button data-page="footy">FootyStats</button>
  </nav>

  <main>
    <div id="app">
      <div class="loading">Memuat pertandingan...</div>
    </div>
  </main>

  <footer>
    Football Center · API-Football + FootyStats
  </footer>

  <script src="footbal.js"></script>
</body>
</html>
