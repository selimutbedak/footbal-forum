<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Football Forum</title>

<style>
:root {
  --bg:#090909;
  --panel:#171717;
  --red:#f1263c;
  --text:#f5f5f5;
  --muted:#999;
  --border:#303030;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input,select { font:inherit; }
button { cursor:pointer; }

.navbar {
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  gap:25px;
  padding:22px 4%;
  background:#111;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}

.brand {
  flex-shrink:0;
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span { color:var(--red); }

.nav-links {
  display:flex;
  gap:22px;
  align-items:center;
}

.nav-links button {
  border:0;
  background:none;
  color:#999;
  font-weight:800;
  font-size:14px;
  white-space:nowrap;
}

.nav-links button.active { color:white; }

.container {
  width:min(1100px,92%);
  min-height:75vh;
  margin:auto;
  padding:30px 0 65px;
}

.section { margin-top:42px; }

.section-title {
  display:flex;
  align-items:center;
  gap:15px;
  margin:0 0 25px;
  font-size:25px;
  font-weight:900;
}

.section-title:before {
  content:"";
  width:8px;
  height:42px;
  border-radius:10px;
  background:var(--red);
  flex-shrink:0;
}

.hero {
  min-height:260px;
  padding:25px;
  margin-bottom:40px;
  border:1px solid #70232e;
  border-radius:26px;
  background:linear-gradient(120deg,#391219,#171313);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.hero-label {
  text-align:center;
  color:#ccc;
}

.hero-teams {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  text-align:center;
}

.hero-team {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.hero-team img,
.hero-team .team-fallback {
  width:55px;
  height:55px;
}

.hero-vs {
  font-size:26px;
  font-weight:900;
}

.hero-bottom {
  display:flex;
  justify-content:space-between;
  color:#bbb;
}

.empty {
  text-align:center;
  color:var(--muted);
  padding:45px 12px;
  font-size:17px;
}

.match-list {
  display:grid;
  gap:14px;
}

.match-card {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:18px;
  cursor:pointer;
}

.match-card:hover { border-color:var(--red); }

.match-league {
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.league-mini-logo {
  width:27px;
  height:27px;
  object-fit:contain;
  flex-shrink:0;
}

.match-content {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
}

.team {
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away {
  justify-content:flex-end;
  text-align:right;
}

.team-name {
  font-size:14px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.team-logo {
  width:36px;
  height:36px;
  object-fit:contain;
  flex-shrink:0;
}

.team-fallback {
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  flex-shrink:0;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:11px;
  font-weight:900;
}

.score {
  min-width:65px;
  text-align:center;
  font-size:20px;
  font-weight:900;
}

.match-meta {
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:17px;
  color:var(--muted);
  font-size:12px;
}

.live { color:var(--red); font-weight:bold; }

.filters {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:25px;
}

.filters input,
.filters select {
  background:var(--panel);
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px;
  min-width:150px;
}

.league-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.league-card {
  display:flex;
  align-items:center;
  gap:15px;
  min-height:105px;
  padding:18px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  cursor:pointer;
}

.league-card:hover { border-color:var(--red); }

.league-logo {
  width:52px;
  height:52px;
  object-fit:contain;
  flex-shrink:0;
}

.league-info { min-width:0; }

.league-card h3 {
  margin:0 0 8px;
  font-size:16px;
}

.league-card p {
  color:var(--muted);
  margin:0;
  font-size:13px;
}

.detail-top { margin-bottom:20px; }

.back-button {
  background:#202020;
  color:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:12px 17px;
}

.detail-score {
  padding:28px 15px;
  background:linear-gradient(130deg,#391219,#171313);
  border:1px solid #70232e;
  border-radius:20px;
  text-align:center;
  margin:20px 0;
}

.detail-score .team {
  flex-direction:column;
  text-align:center;
}

.detail-score .team-logo,
.detail-score .team-fallback {
  width:55px;
  height:55px;
}

.detail-score .score { font-size:29px; }

.detail-info {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  margin-top:15px;
}

.info-row {
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.info-row:last-child { border:0; }
.info-row span:first-child { color:var(--muted); }

.table-wrap {
  overflow-x:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
}

table {
  width:100%;
  min-width:580px;
  border-collapse:collapse;
}

th,td {
  padding:14px 12px;
  text-align:center;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

th { color:var(--muted); font-size:11px; }

td:nth-child(2),th:nth-child(2) { text-align:left; }

.table-team {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:160px;
}

.table-team img {
  width:29px;
  height:29px;
  object-fit:contain;
  flex-shrink:0;
}

.loading {
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
}

.error {
  padding:17px;
  background:#35151a;
  border:1px solid #8a2837;
  border-radius:12px;
  color:#ffb5bf;
  margin:15px 0;
}

.footer {
  border-top:1px solid var(--border);
  padding:25px 5%;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:600px) {
  .navbar { gap:20px; padding:20px 4%; }
  .brand { font-size:22px; }
  .nav-links { gap:18px; }
  .nav-links button { font-size:12px; }
  .container { padding-top:22px; }
  .hero { min-height:245px; padding:20px 14px; }
  .hero-team { font-size:13px; }
  .section-title { font-size:22px; }
  .league-grid { grid-template-columns:1fr; }
  .team { gap:6px; }
  .team-name { font-size:12px; }
  .team-logo,.team-fallback { width:30px;height:30px; }
  .score { min-width:48px;font-size:17px; }
}
</style>
</head>

<body>

<header class="navbar">
  <div class="brand">FOOTBALL<span>FORUM</span></div>

  <nav class="nav-links">
    <button id="nav-home" class="active" onclick="showPage('home')">HOME</button>
    <button id="nav-matches" onclick="showPage('matches')">MATCHES</button>
    <button id="nav-leagues" onclick="showPage('leagues')">LEAGUES</button>
  </nav>
</header>

<main class="container">
  <div id="app">
    <div class="loading">Memuat Football Forum...</div>
  </div>
</main>

<footer class="footer">
  FOOTBALL FORUM · Football information and match centre
</footer>

<script>
const API = "/api/football";

const LEAGUES = [
  {id:"PL",name:"Premier League",country:"England"},
  {id:"ELC",name:"Championship",country:"England"},
  {id:"BL1",name:"Bundesliga",country:"Germany"},
  {id:"SA",name:"Serie A",country:"Italy"},
  {id:"PD",name:"La Liga",country:"Spain"},
  {id:"FL1",name:"Ligue 1",country:"France"},
  {id:"DED",name:"Eredivisie",country:"Netherlands"},
  {id:"PPL",name:"Primeira Liga",country:"Portugal"},
  {id:"BSA",name:"Brasileirão",country:"Brazil"},
  {id:"CL",name:"UEFA Champions League",country:"Europe"},
  {id:"EC",name:"European Championship",country:"Europe"},
  {id:"WC",name:"FIFA World Cup",country:"World"}
];

const app = document.getElementById("app");

let selectedDate = jakartaDate();
let selectedLeague = "ALL";
let currentPage = "home";

function jakartaDate(date = new Date()) {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone:"Asia/Jakarta",
    year:"numeric",
    month:"2-digit",
    day:"2-digit"
  }).format(date);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[c]);
}

async function api(params = {}) {
  const query = new URLSearchParams(params);
  const response = await fetch(`${API}?${query}`);

  const result = await response.json().catch(() => ({}));

  if (!response.ok || !result.ok) {
    throw new Error(result.error || `API error ${response.status}`);
  }

  return result.data;
}

function formatDate(value) {
  if (!value) return "-";

  return new Intl.DateTimeFormat("id-ID", {
    timeZone:"Asia/Jakarta",
    day:"numeric",
    month:"short",
    year:"numeric"
  }).format(new Date(value));
}

function formatTime(value) {
  if (!value) return "-";

  return new Intl.DateTimeFormat("id-ID", {
    timeZone:"Asia/Jakarta",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(new Date(value));
}

function initials(name) {
  return String(name || "?")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function teamLogo(url,name) {
  const fallback = `<span class="team-fallback">${escapeHTML(initials(name))}</span>`;

  if (!url) return fallback;

  return `
    <img class="team-logo"
      src="${escapeHTML(url)}"
      alt="${escapeHTML(name)}"
      loading="lazy"
      onerror="this.outerHTML='${fallback.replace(/'/g,"&#39;")}'">
  `;
}

function leagueLogo(url,name) {
  if (!url) {
    return `<span class="team-fallback">${escapeHTML(initials(name))}</span>`;
  }

  const fallback = `<span class="team-fallback">${escapeHTML(initials(name))}</span>`;

  return `
    <img class="league-mini-logo"
      src="${escapeHTML(url)}"
      alt="${escapeHTML(name)}"
      loading="lazy"
      onerror="this.outerHTML='${fallback.replace(/'/g,"&#39;")}'">
  `;
}

function matchStatus(match) {
  if (match.live) return `<span class="live">● LIVE</span>`;
  if (match.finished) return "FULL TIME";
  if (match.status === "POSTPONED") return "POSTPONED";
  if (match.status === "CANCELLED") return "CANCELLED";
  return formatTime(match.date);
}

function matchScore(match) {
  if (match.homeScore !== null && match.homeScore !== undefined &&
      match.awayScore !== null && match.awayScore !== undefined) {
    return `${match.homeScore} - ${match.awayScore}`;
  }

  return "VS";
}

function sectionTitle(title) {
  return `<h2 class="section-title">${escapeHTML(title)}</h2>`;
}

function matchCard(match) {
  return `
    <article class="match-card" onclick="openMatch(${Number(match.id)})">

      <div class="match-league">
        ${leagueLogo(match.leagueLogo,match.league)}
        <span>${escapeHTML(match.league)} · ${escapeHTML(match.country || "")}</span>
      </div>

      <div class="match-content">
        <div class="team">
          ${teamLogo(match.homeLogo,match.home)}
          <span class="team-name">${escapeHTML(match.home)}</span>
        </div>

        <div class="score">${escapeHTML(matchScore(match))}</div>

        <div class="team away">
          <span class="team-name">${escapeHTML(match.away)}</span>
          ${teamLogo(match.awayLogo,match.away)}
        </div>
      </div>

      <div class="match-meta">
        <span>${escapeHTML(match.stage || (match.matchday ? "Matchday " + match.matchday : "Football Match"))}</span>
        <span>${matchStatus(match)}</span>
      </div>
    </article>
  `;
}

function setActiveNav(page) {
  document.querySelectorAll(".nav-links button").forEach(button => {
    button.classList.remove("active");
  });

  const button = document.getElementById(`nav-${page}`);
  if (button) button.classList.add("active");
}

async function showPage(page) {
  currentPage = page;
  setActiveNav(page);
  app.innerHTML = `<div class="loading">Memuat data...</div>`;

  try {
    if (page === "home") await renderHome();
    if (page === "matches") await renderMatches();
    if (page === "leagues") await renderLeagues();
  } catch (error) {
    showError(error);
  }

  window.scrollTo({top:0,behavior:"smooth"});
}

async function renderHome() {
  const data = await api({
    type:"home",
    date:selectedDate
  });

  const matches = data.matches || [];
  const upcoming = data.upcoming || [];
  const live = data.live || [];

  const featured =
    matches.find(match => !match.finished) ||
    upcoming[0] ||
    matches[0];

  const visibleMatches = matches.length ? matches : upcoming;
  const heading = matches.length ? "TODAY'S MATCHES" : "UPCOMING MATCHES";

  app.innerHTML = `
    ${featured ? `
      <section class="hero">
        <div class="hero-label">
          ${escapeHTML(featured.league)} · ${formatDate(featured.date)}
        </div>

        <div class="hero-teams">
          <div class="hero-team">
            ${teamLogo(featured.homeLogo,featured.home)}
            <span>${escapeHTML(featured.home)}</span>
          </div>

          <div class="hero-vs">VS</div>

          <div class="hero-team">
            ${teamLogo(featured.awayLogo,featured.away)}
            <span>${escapeHTML(featured.away)}</span>
          </div>
        </div>

        <div class="hero-bottom">
          <span>${featured.finished ? "FULL TIME" : "MATCH DAY"}</span>
          <span>${escapeHTML(matchScore(featured))}</span>
        </div>
      </section>
    ` : ""}

    <section class="section">
      ${sectionTitle("LIVE MATCHES")}

      ${live.length
        ? `<div class="match-list">${live.map(matchCard).join("")}</div>`
        : `<div class="empty">Tidak ada pertandingan live saat ini.</div>`
      }
    </section>

    <section class="section">
      ${sectionTitle(heading)}

      ${visibleMatches.length
        ? `<div class="match-list">${visibleMatches.map(matchCard).join("")}</div>`
        : `<div class="empty">Belum ada jadwal pertandingan yang tersedia.</div>`
      }
    </section>
  `;
}

async function renderMatches() {
  app.innerHTML = `
    ${sectionTitle("MATCHES")}

    <div class="filters">
      <input type="date" id="date-filter"
        value="${selectedDate}"
        onchange="changeDate(this.value)">

      <select id="league-filter" onchange="changeLeague(this.value)">
        <option value="ALL">All competitions</option>
        ${LEAGUES.map(item => `
          <option value="${item.id}" ${selectedLeague === item.id ? "selected" : ""}>
            ${escapeHTML(item.name)}
          </option>
        `).join("")}
      </select>
    </div>

    <div id="matches-results">
      <div class="loading">Memuat pertandingan...</div>
    </div>
  `;

  await loadMatches();
}

async function loadMatches() {
  const target = document.getElementById("matches-results");
  if (!target) return;

  target.innerHTML = `<div class="loading">Memuat pertandingan...</div>`;

  try {
    const matches = await api({
      type:"matches",
      dateFrom:selectedDate,
      dateTo:selectedDate,
      league:selectedLeague
    });

    target.innerHTML = matches.length
      ? `<div class="match-list">${matches.map(matchCard).join("")}</div>`
      : `<div class="empty">Tidak ada pertandingan ditemukan pada tanggal ini.</div>`;

  } catch (error) {
    target.innerHTML = `<div class="error">${escapeHTML(error.message)}</div>`;
  }
}

function changeDate(value) {
  if (!value) return;
  selectedDate = value;
  loadMatches();
}

function changeLeague(value) {
  selectedLeague = value;
  loadMatches();
}

async function renderLeagues() {
  app.innerHTML = `
    ${sectionTitle("LEAGUES")}
    <div class="loading">Memuat kompetisi...</div>
  `;

  const leagues = await api({type:"leagues"});

  app.innerHTML = `
    ${sectionTitle("LEAGUES")}

    <div class="league-grid">
      ${leagues.map(league => {
        const logo = league.emblem ||
          `https://crests.football-data.org/${league.id}.png`;

        return `
          <article class="league-card" onclick="openLeague('${league.id}')">
            <img class="league-logo"
              src="${escapeHTML(logo)}"
              alt="${escapeHTML(league.name)}"
              loading="lazy"
              onerror="this.outerHTML='<span class=&quot;team-fallback&quot;>${escapeHTML(initials(league.name))}</span>'">

            <div class="league-info">
              <h3>${escapeHTML(league.name)}</h3>
              <p>${escapeHTML(league.country)}</p>
            </div>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

async function openLeague(code) {
  const league = LEAGUES.find(item => item.id === code);
  if (!league) return;

  currentPage = "league-detail";
  app.innerHTML = `<div class="loading">Memuat klasemen...</div>`;
  window.scrollTo({top:0,behavior:"smooth"});

  try {
    const data = await api({
      type:"standings",
      league:code
    });

    const table = (data.standings || []).find(
      item => item.type === "TOTAL"
    ) || data.standings?.[0];

    const rows = table?.table || [];

    app.innerHTML = `
      <div class="detail-top">
        <button class="back-button" onclick="showPage('leagues')">
          ← Kembali ke Leagues
        </button>
      </div>

      ${sectionTitle(league.name)}

      ${rows.length ? `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>TEAM</th>
                <th>MP</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GD</th>
                <th>PTS</th>
              </tr>
            </thead>

            <tbody>
              ${rows.map(row => {
                const team = row.team || {};
                const crest = team.crest ||
                  (team.id ? `https://crests.football-data.org/${team.id}.svg` : "");

                return `
                  <tr>
                    <td>${row.position ?? "-"}</td>

                    <td>
                      <div class="table-team">
                        ${crest ? `
                          <img src="${escapeHTML(crest)}"
                            alt="${escapeHTML(team.name || "Club")}"
                            loading="lazy"
                            onerror="this.outerHTML='<span class=&quot;team-fallback&quot;>${escapeHTML(initials(team.name))}</span>'">
                        ` : `
                          <span class="team-fallback">${escapeHTML(initials(team.name))}</span>
                        `}

                        <span>${escapeHTML(team.shortName || team.name || "-")}</span>
                      </div>
                    </td>

                    <td>${row.playedGames ?? "-"}</td>
                    <td>${row.won ?? "-"}</td>
                    <td>${row.draw ?? "-"}</td>
                    <td>${row.lost ?? "-"}</td>
                    <td>${row.goalDifference ?? "-"}</td>
                    <td><strong>${row.points ?? "-"}</strong></td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      ` : `
        <div class="empty">Klasemen belum tersedia.</div>
      `}
    `;

  } catch (error) {
    showError(error,"leagues");
  }
}

async function openMatch(id) {
  currentPage = "match-detail";
  app.innerHTML = `<div class="loading">Memuat detail pertandingan...</div>`;
  window.scrollTo({top:0,behavior:"smooth"});

  try {
    const data = await api({
      type:"match",
      id
    });

    const match = data.fixture;
    const goals = data.goals || [];
    const bookings = data.bookings || [];
    const substitutions = data.substitutions || [];

    app.innerHTML = `
      <div class="detail-top">
        <button class="back-button" onclick="showPage('matches')">
          ← Kembali ke Matches
        </button>
      </div>

      <div class="detail-score">
        <div class="match-league">
          ${leagueLogo(match.leagueLogo,match.league)}
          <span>${escapeHTML(match.league)} · ${formatDate(match.date)}</span>
        </div>

        <div class="match-content">
          <div class="team">
            ${teamLogo(match.homeLogo,match.home)}
            <span class="team-name">${escapeHTML(match.home)}</span>
          </div>

          <div>
            <div class="score">${escapeHTML(matchScore(match))}</div>
            <div class="match-meta" style="justify-content:center">
              ${matchStatus(match)}
            </div>
          </div>

          <div class="team">
            ${teamLogo(match.awayLogo,match.away)}
            <span class="team-name">${escapeHTML(match.away)}</span>
          </div>
        </div>
      </div>

      ${sectionTitle("MATCH INFORMATION")}

      <div class="detail-info">
        ${infoRow("Competition",match.league)}
        ${infoRow("Date",formatDate(match.date))}
        ${infoRow("Kick-off",formatTime(match.date))}
        ${infoRow("Status",match.status)}
        ${infoRow("Matchday",match.matchday || "-")}
        ${infoRow("Venue",match.venue || "Not available")}
        ${infoRow("Referee",match.referee || "Not available")}
      </div>

      ${sectionTitle("GOALS")}

      <div class="detail-info">
        ${goals.length
          ? goals.map(goal => infoRow(
              `${goal.minute ?? "-"}'`,
              `${goal.scorer?.name || "Goal"} · ${goal.team?.name || ""}`
            )).join("")
          : `<div class="empty">Informasi gol belum tersedia.</div>`
        }
      </div>

      ${sectionTitle("OTHER MATCH EVENTS")}

      <div class="detail-info">
        ${bookings.length || substitutions.length
          ? [
              ...bookings.map(item => infoRow(
                `${item.minute ?? "-"}'`,
                `${item.player?.name || "Player"} · ${item.card || "Card"}`
              )),
              ...substitutions.map(item => infoRow(
                `${item.minute ?? "-"}'`,
                `Pergantian pemain: ${item.playerOut?.name || "-"} → ${item.playerIn?.name || "-"}`
              ))
            ].join("")
          : `<div class="empty">Informasi kartu dan pergantian pemain belum tersedia.</div>`
        }
      </div>
    `;

  } catch (error) {
    showError(error,"matches");
  }
}

function infoRow(label,value) {
  return `
    <div class="info-row">
      <span>${escapeHTML(label)}</span>
      <strong>${escapeHTML(value || "-")}</strong>
    </div>
  `;
}

function showError(error,backPage="home") {
  app.innerHTML = `
    <div class="error">
      <strong>Terjadi kesalahan</strong>
      <p>${escapeHTML(error.message || "Gagal memuat data.")}</p>
    </div>

    <button class="back-button" onclick="showPage('${backPage}')">
      ← Kembali
    </button>
  `;
}

showPage("home");
</script>

</body>
</html>
